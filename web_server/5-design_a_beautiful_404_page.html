
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #101827, #263b5e);
            color: white;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .container {
            padding: 30px;
        }

        h1 {
            font-size: 100px;
            margin: 0;
            color: #38bdf8;
        }

        h2 {
            font-size: 30px;
        }

        p {
            font-size: 18px;
            color: #d1d5db;
        }

        a {
            display: inline-block;
            margin-top: 20px;
            padding: 14px 28px;
            background: #38bdf8;
            color: #101827;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
        }

        a:hover {
            background: white;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>404</h1>
        <h2>Oops! Page Not Found</h2>
        <p>Ceci n'est pas une page</p>
        <p>The page you are looking for might have been moved or deleted.</p>
        <a href="/">Go Back Home</a>
    </div>
</body>
</html>
