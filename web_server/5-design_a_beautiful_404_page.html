<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Lost in Space</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            font-family: Arial, sans-serif;
            color: white;
            background:
                radial-gradient(circle at 50% 45%, #243b70 0%, #10152e 42%, #050713 100%);
        }

        .stars {
            position: fixed;
            inset: 0;
            background-image:
                radial-gradient(2px 2px at 20% 30%, white 50%, transparent 100%),
                radial-gradient(2px 2px at 70% 20%, white 50%, transparent 100%),
                radial-gradient(1px 1px at 40% 80%, white 50%, transparent 100%),
                radial-gradient(2px 2px at 85% 65%, white 50%, transparent 100%),
                radial-gradient(1px 1px at 10% 75%, white 50%, transparent 100%);
            background-size: 300px 300px;
            opacity: 0.8;
            animation: twinkle 4s infinite alternate;
        }

        .container {
            position: relative;
            z-index: 1;
            max-width: 700px;
            padding: 40px 24px;
            text-align: center;
        }

        .planet {
            width: 110px;
            height: 110px;
            margin: 0 auto 20px;
            border-radius: 50%;
            background: linear-gradient(135deg, #7c5cff, #21d4fd);
            box-shadow: 0 0 55px #6c63ff;
            animation: float 4s ease-in-out infinite;
        }

        h1 {
            font-size: clamp(6rem, 20vw, 11rem);
            line-height: 1;
            letter-spacing: 10px;
            color: #ffffff;
            text-shadow: 0 0 20px #8b7cff, 0 0 50px #5548ff;
        }

        h2 {
            margin: 20px 0 12px;
            font-size: 2rem;
        }

        p {
            color: #c4c9e8;
            font-size: 1.05rem;
            line-height: 1.7;
        }

        .message {
            margin-top: 15px;
            font-size: 0.95rem;
            color: #aab2d5;
        }

        a {
            display: inline-block;
            margin-top: 30px;
            padding: 14px 28px;
            border-radius: 30px;
            background: linear-gradient(90deg, #7657ff, #21b7e8);
            color: white;
            text-decoration: none;
            font-weight: bold;
            transition: transform 0.3s, box-shadow 0.3s;
        }

        a:hover {
            transform: translateY(-4px);
            box-shadow: 0 0 25px #7657ff;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }

        @keyframes twinkle {
            from { opacity: 0.4; }
            to { opacity: 1; }
        }

        @media (max-width: 480px) {
            h2 { font-size: 1.5rem; }
            .container { padding: 24px 16px; }
        }
    </style>
</head>

<body>
    <div class="stars"></div>

    <main class="container">
        <div class="planet"></div>

        <h1>404</h1>

        <h2>Oops! You're Lost in Space.</h2>

        <p>
            Looks like this page has drifted beyond our galaxy.
            Don't worry, even astronauts need directions sometimes.
        </p>

        <p class="message">Ceci n'est pas une page</p>

        <a href="/">Take Me Home</a>
    </main>
</body>
</html>
